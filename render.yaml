# Render Blueprint: one web service (API + embedded worker) and PostgreSQL.
# Dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: lumenboard-support
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lumenboard-db
          property: connectionString
      - key: EMBEDDED_WORKER
        value: "1"
      - key: WORKER_CONCURRENCY
        value: "10"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini

databases:
  - name: lumenboard-db
    plan: free
    databaseName: helpdesk
    user: helpdesk
