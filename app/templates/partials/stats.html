<div id="stats" hx-get="/operator/stats?filter={{ current }}&amp;since={{ since }}" hx-trigger="every 5s" hx-swap="outerHTML">
  <div class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-4">
    {% for key, label, value, accent in stat_cards %}
    <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
      <div class="flex items-center gap-2 text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400">
        <span class="h-2 w-2 rounded-full {{ accent }}"></span>{{ label }}
      </div>
      <div class="mt-2 text-2xl font-semibold tabular-nums">{{ value }}</div>
    </div>
    {% endfor %}
  </div>
  <div class="mt-6 flex flex-wrap gap-2">
    {% for key, label, count in tabs %}
    <a href="/operator?filter={{ key }}"
       class="inline-flex items-center gap-2 rounded-full px-3.5 py-1.5 text-sm font-medium transition
              {% if key == current %}bg-indigo-600 text-white shadow-sm{% else %}bg-white text-slate-600 ring-1 ring-slate-200 hover:bg-slate-50 dark:bg-slate-900 dark:text-slate-300 dark:ring-slate-800 dark:hover:bg-slate-800{% endif %}">
      {{ label }}
      <span class="rounded-full px-1.5 text-xs tabular-nums {% if key == current %}bg-white/20{% else %}bg-slate-100 dark:bg-slate-800{% endif %}">{{ count }}</span>
    </a>
    {% endfor %}
  </div>
  {% if new_since %}
  <a href="/operator?filter={{ current }}" class="mt-4 flex items-center justify-center gap-2 rounded-lg bg-indigo-50 px-4 py-2 text-sm font-medium text-indigo-700 ring-1 ring-indigo-200 transition hover:bg-indigo-100 dark:bg-indigo-950 dark:text-indigo-300 dark:ring-indigo-900">
    {{ new_since }} new ticket{{ "s" if new_since != 1 }} — click to load
  </a>
  {% endif %}
</div>
